<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendas Externo × Leads — Estudo Corretoras (2025 · 2026)</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#0f1623;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
       display:flex;flex-direction:column;height:100vh;overflow:hidden;color:#e8edf5}
  .tabbar{display:flex;align-items:center;gap:8px;padding:10px 18px;flex:0 0 auto;
          background:linear-gradient(180deg,#0c121d,#0f1623);border-bottom:1px solid #27344a}
  .brand{margin-right:18px;line-height:1.15}
  .brand b{font-size:14.5px;font-weight:700;letter-spacing:-.2px;color:#e8edf5}
  .brand small{display:block;color:#64748b;font-size:11px;font-weight:500;margin-top:1px}
  .tab{appearance:none;border:1px solid #27344a;background:#1b2638;color:#93a1b8;
       font-size:14px;font-weight:700;padding:8px 26px;border-radius:9px;cursor:pointer;
       transition:background .12s,color .12s,border-color .12s}
  .tab:hover{color:#e8edf5;border-color:#ffa94d}
  .tab.active{background:linear-gradient(180deg,#ffa94d,#f2820d);border-color:#f2820d;color:#0f1623}
  .spacer{flex:1 1 auto}
  .hint{color:#64748b;font-size:11.5px}
  iframe{flex:1 1 auto;width:100%;border:0;background:#0f1623;display:block}
</style>
</head>
<body>
  <div class="tabbar">
    <div class="brand"><b>Vendas do Time Externo × Origem em Leads</b>
      <small>estudo de corretoras · Hapvida · métrica = vidas</small></div>
    <button class="tab" data-y="2025">2025</button>
    <button class="tab active" data-y="2026">2026</button>
    <span class="spacer"></span>
    <span class="hint">selecione o ano ↑</span>
  </div>
  <iframe id="fr" src="2026.html" title="dashboard do ano selecionado"></iframe>
<script>
  var fr = document.getElementById('fr');
  var tabs = document.querySelectorAll('.tab');
  tabs.forEach(function(t){
    t.addEventListener('click', function(){
      tabs.forEach(function(x){ x.classList.remove('active'); });
      t.classList.add('active');
      fr.src = t.dataset.y + '.html';
    });
  });
</script>
</body>
</html>
